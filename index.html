<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minha Casinha 🩷</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#fff5f8;
  margin:0;
}

header{
  background:#f8a5c2;
  color:white;
  text-align:center;
  padding:25px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.formulario{
  background:white;
  padding:15px;
  border-radius:15px;
  margin-bottom:20px;
}

input, select{
  width:100%;
  padding:10px;
  margin:6px 0;
  box-sizing:border-box;
}

button{
  background:#ff69b4;
  color:white;
  border:none;
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
}

.lista{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

.card{
  background:white;
  padding:15px;
  border-radius:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:10px;
}

.preco{
  color:#d63384;
  font-weight:bold;
}
</style>
</head>

<body>

<header>
  <h1>🏡🩷 Minha Casinha</h1>
  <p>Lista de compras para meu lar</p>
</header>

<div class="container">

<div class="formulario">
<input id="nome" placeholder="Nome do item">

<input id="imagem" placeholder="Link da imagem">

<input id="loja" placeholder="Link da loja">

<input id="preco" type="number" placeholder="Preço">

<select id="categoria">
<option>🍽️ Cozinha</option>
<option>🛏️ Quarto</option>
<option>🛋️ Sala</option>
<option>🚿 Banheiro</option>
<option>✨ Decoração</option>
</select>

<button onclick="adicionarItem()">
Adicionar 🩷
</button>

</div>

<h2>
💰 Total: R$
<span id="total">0.00</span>
</h2>

<div id="lista" class="lista"></div>

</div>

<script>

const senha = prompt("Digite a senha ❤️");

if (senha !== "AMOTE") {
    document.body.innerHTML = "<h1>Acesso negado ❌</h1>";
    throw new Error("Acesso negado");
}

let itens = JSON.parse(localStorage.getItem("itens")) || [];
  
  

function renderizar(){

let total = 0;

const lista = document.getElementById("lista");

lista.innerHTML = "";

itens.forEach((item,index)=>{

total += item.preco;

lista.innerHTML += `
<div class="card">

${item.imagem}

<h3>${item.nome}</h3>

<p>${item.categoria}</p>

<p class="preco">
R$ ${item.preco.toFixed(2)}
</p>

<p>
${item.loja}
🔗 Ver Produto
</a>
</p>

<button onclick="removerItem(${index})">
❌ Excluir
</button>

</div>
`;

});

document.getElementById("total").innerText =
total.toFixed(2);

}

function adicionarItem(){

const nome =
document.getElementById("nome").value;

if(!nome) return;

itens.push({
nome,
imagem: document.getElementById("imagem").value,
loja: document.getElementById("loja").value,
preco: parseFloat(document.getElementById("preco").value) || 0,
categoria: document.getElementById("categoria").value
});

localStorage.setItem("itens", JSON.stringify(itens));

renderizar();


}

function removerItem(index){

itens.splice(index,1);

localStorage.setItem("itens", JSON.stringify(itens));

renderizar();

}

renderizar();
  

</script>

</body>
</html>
